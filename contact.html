<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact -  NexusGear</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script type="module" src="./js/contact.js"></script>
</head>
<body>
    
    <header>
        <a href="index.html" class="logo">
            <img src="assets/logo.svg" alt="NexusGear Logo">
        </a>
        
        <nav>
            <ul>
                <li><a href="index.html" >Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>

        <div class="search-bar">
            <input type="text" placeholder="Zoeken...">
            <button>&#128269;</button>
        </div>
    </header>

    <main>
        <section class="contact-hero">
            <h1>Contact formulier</h1>
            <p>Vul het formulier in en we helpen je zo spoedig mogelijk</p>
        </section>

        <div id="map" class="contact-map"></div>

        <form action="#" method="post" class="contact-form">
            <div class="form-group">
                <label for="name">Naam:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="who">Wie contacteren:</label>
                <select id="who" name="who" required>
                    <option value="" disabled selected>Kies een optie</option>
                    <option value="klantenservice">Klantenservice</option>
                    <option value="tech">Technische ondersteuning</option>
                    <option value="Sales">Verkoop</option>
                    <option value="support">Support</option>
                    <option value="andere">Andere</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Bericht:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Verzenden</button>
        </form>
    </main>

     <footer>
        <p>&copy; 2026 NexusGear &mdash; Webdesign &amp; ontwikkeling door Soufiane</p>
    </footer>
    
</body>
</html>
