<svg width="400" height="220" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <title>NexusGear Logo</title>

  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4d94ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d94ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="220" rx="16" fill="#0d0d0d"/>

  <!-- Icon hexagon -->
  <polygon points="70,40 110,20 150,40 150,80 110,100 70,80" fill="#1a1a2e" stroke="url(#iconGrad)" stroke-width="2"/>

  <!-- Geometric N mark -->
  <g fill="url(#iconGrad)">
    <rect x="81" y="43" width="9" height="34" rx="2"/>
    <rect x="130" y="43" width="9" height="34" rx="2"/>
    <polygon points="90,43 99,43 139,77 130,77"/>
  </g>

  <!-- NEXUS wordmark -->
  <text x="165" y="68"
    font-family="'Rajdhani', 'Arial Narrow', sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="3"
    fill="url(#textGrad)">NEXUS</text>

  <!-- GEAR sub-wordmark -->
  <text x="168" y="93"
    font-family="'Rajdhani', 'Arial Narrow', sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="8"
    fill="#e0e0e0"
    opacity="0.7">GEAR</text>

  <!-- Accent line -->
  <line x1="168" y1="100" x2="320" y2="100" stroke="url(#iconGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Tagline -->
  <text x="168" y="118"
    font-family="'Inter', Arial, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="3"
    fill="#e0e0e0"
    opacity="0.45">PLAY AT YOUR PEAK</text>

</svg>
